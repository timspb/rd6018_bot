name: Apply CC compatibility fixes

on:
  push:
    branches:
      - refactor/pb-recovery-controller-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pb-recovery-controller-v2
      - name: Patch compatibility and stale strings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'recovery_trace_report.py',
              '''def _finish_reversal_metrics(row: Any, shadow: Mapping[str, Any]) -> Dict[str, Any]:\n    is_cv = bool(row["is_cv"])\n    is_cc = bool(row["is_cc"]) if row["is_cc"] is not None else not is_cv\n    if is_cc and not is_cv:\n        return {"mode": "cc", "voltage": _voltage_reversal_metrics(shadow)}\n    return {"mode": "cv", "current": _reversal_metrics(row, shadow)}\n''',
              '''def _finish_reversal_metrics(row: Any, shadow: Mapping[str, Any]) -> Dict[str, Any]:\n    """Return mode-specific finish evidence without breaking the existing CV shape."""\n    is_cv = bool(row["is_cv"])\n    is_cc = bool(row["is_cc"]) if row["is_cc"] is not None else not is_cv\n    if is_cc and not is_cv:\n        result = _voltage_reversal_metrics(shadow)\n        result["mode"] = "cc"\n        return result\n    result = _reversal_metrics(row, shadow)\n    result["mode"] = "cv"\n    return result\n'''
          )

          p = Path('charge_logic.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '>= 10ч. V_max': '>= 20ч. V_max',
              '>= 8ч. V_max': '>= 20ч. V_max',
              '>= 5ч. V_max': '>= 10ч. V_max',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          Path('.github/workflows/_fix_cc_compat.yml').unlink()
          PY
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve CV report compatibility after CC split'
          git push origin HEAD:refactor/pb-recovery-controller-v2
