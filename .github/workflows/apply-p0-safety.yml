name: Apply P0 safety migration

on:
  push:
    branches:
      - refactor/pb-recovery-controller-v2
    paths:
      - tools/apply_p0_charge_logic.py
      - .github/workflows/apply-p0-safety.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pb-recovery-controller-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply guarded migration
        run: python tools/apply_p0_charge_logic.py
      - name: Validate syntax and diff
        run: |
          python -m compileall -q charge_logic.py legacy_safety.py
          git diff --check
          git diff --exit-code --quiet && { echo 'Migration produced no changes'; exit 1; } || true
      - name: Commit patched FSM
        run: |
          git config user.name 'timspb'
          git config user.email '5390894+timspb@users.noreply.github.com'
          git add charge_logic.py
          git commit -m 'safety: enforce hard legacy charging invariants'
          git push origin HEAD:refactor/pb-recovery-controller-v2
