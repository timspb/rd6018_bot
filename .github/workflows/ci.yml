name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      TG_TOKEN: '123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi'
      HA_URL: 'http://127.0.0.1:8123'
      HA_TOKEN: 'ci-test-token'
      HA_PREFER_LOCAL: '0'
      ESPHOME_API_HOST: '127.0.0.1'
      ESPHOME_API_PORT: '6053'
      ESPHOME_API_KEY: 'ci-test-key'
      ALLOWED_CHAT_IDS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # D061 pinned exact-source archive test needs base commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: timeout --signal=TERM --kill-after=15s 1200s python -m unittest discover -s tests -p 'test_*.py' -v
      - name: D061 guarded acceptance sink tests
        run: python -m unittest tools.acceptance_guard.test_transient tools.acceptance_guard.test_sinks -v
