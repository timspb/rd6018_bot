name: ESPHome firmware

on:
  push:
    branches:
      - 'refactor/**'
      - 'fix/**'
    paths:
      - 'esphome/**'
      - '.github/workflows/esphome.yml'
  pull_request:
    paths:
      - 'esphome/**'
      - '.github/workflows/esphome.yml'

jobs:
  compile-rd6018-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ESPHome 2026.8.2
        run: |
          python -m pip install --upgrade pip
          python -m pip install esphome==2026.8.2
          esphome version
      - name: Prepare CI secrets
        run: cp esphome/secrets.example.yaml esphome/secrets.yaml
      - name: Validate configuration
        run: esphome config esphome/rd6018_controller_v2.yaml
      - name: Compile firmware
        run: esphome compile esphome/rd6018_controller_v2.yaml
      - name: Stage OTA firmware
        run: |
          firmware="$(find esphome/.esphome -type f -path '*/.pioenvs/rd6018-controller/firmware.bin' -print -quit)"
          test -n "$firmware"
          cp "$firmware" rd6018-controller-v2.bin
          test -s rd6018-controller-v2.bin
      - name: Upload OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: rd6018-controller-v2-${{ github.sha }}
          path: rd6018-controller-v2.bin
          if-no-files-found: error
          retention-days: 14
