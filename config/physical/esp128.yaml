# Тип транспорта
# Transport type
type: esphome
connection:
  # Адрес ESPHome API
  # ESPHome API address
  host: 192.168.1.28
  # Порт ESPHome native API, TCP
  # ESPHome native API port, TCP
  port: 6053
  # API использует Noise-шифрование
  # API uses Noise encryption
  encrypted: true
  # Имя переменной окружения с ключом шифрования
  # Environment variable containing the encryption key
  key_env: ESPHOME_API_KEY

# Имена объектов ESPHome; при изменении прошивки обновляется только этот mapping
# ESPHome object names; firmware changes update only this mapping
entities:
  voltage: output_voltage
  current: output_current
  temperature: temperature
  output_state: output_state_code_v2
  configured_voltage: set_voltage_readback_v2
  configured_current: set_current_readback_v2
  ovp: ovp_readback_v2
  ocp: ocp_readback_v2
