# Тип транспорта
# Transport type
type: esphome
connection:
  # Адрес ESPHome API
  # ESPHome API address
  host: 192.168.1.28
  # Порт ESPHome native API, TCP
  # ESPHome native API port, TCP
  port: 6053
  # API использует Noise-шифрование
  # API uses Noise encryption
  encrypted: true
  # Имя переменной окружения с ключом шифрования
  # Environment variable containing the encryption key
  key_env: ESPHOME_API_KEY

# Имена объектов ESPHome; при изменении прошивки обновляется только этот mapping
# ESPHome object names; firmware changes update only this mapping
entities:
  voltage: rd6018_output_voltage_legacy
  current: rd6018_output_current_legacy
  temperature: rd6018_temperature_internal_v2
  output_state: rd6018_output_state_code_v2
  configured_voltage: rd6018_set_voltage_readback_v2
  configured_current: rd6018_set_current_readback_v2
  ovp: rd6018_ovp_readback_v2
  ocp: rd6018_ocp_readback_v2
