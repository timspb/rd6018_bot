# Тип транспорта
# Transport type
type: esphome
connection:
  # Адрес ESPHome API
  # ESPHome API address
  host: ""
  # Порт ESPHome native API, TCP
  # ESPHome native API port, TCP
  port: 0
  # API использует Noise-шифрование
  # API uses Noise encryption
  encrypted: true
  # Имя переменной окружения с ключом шифрования
  # Environment variable containing the encryption key
  key_env: ESPHOME_API_KEY

# Имена объектов ESPHome; при изменении прошивки обновляется только этот mapping
# ESPHome object names; firmware changes update only this mapping
entities:
  control_output: output
  control_voltage: output_voltage
  control_current: output_current
  control_ovp: over_voltage_protection
  control_ocp: over_current_protection
  voltage: output_voltage
  current: output_current
  temperature: temperature
  temp_int: temperature_internal_v2
  temp_ext: temperature_external_v2
  power: output_power_v2
  protection_code: protection_status_code
  regulation_code: regulation_mode_code
  switch: output
  take_ok: take_ok_v2
  take_out: take_out_v2
  boot_power: boot_power_v2
  battery_voltage: battery_voltage
  output_state: output_state_code_v2
  configured_voltage: set_voltage_readback_v2
  configured_current: set_current_readback_v2
  ovp: ovp_readback_v2
  ocp: ocp_readback_v2
