# Автоматическая физическая активация всегда запрещена этим конфигом.
# Automatic physical activation is always forbidden by this configuration.
physical_execution_enabled: false
# Для физического выполнения требуется ручная ARM-процедура.
# Physical execution requires a manual ARM procedure.
require_manual_arm: true
# Интервал чтения телеметрии, секунды
# Telemetry polling interval, seconds
telemetry_interval_s: 5
