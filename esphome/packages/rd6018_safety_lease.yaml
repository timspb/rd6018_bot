# RD6018 local dead-man safety lease and autonomous ownership state
#
# Include this file as an ESPHome package in the *same node* that owns the
# RD6018 Modbus controller. It assumes that controller has id: powersupply,
# matching the current rdtech ESPHome layout (whose controller poll interval is 5 s).
#
# Managed safety model:
#   bot/HA -> renew every 5 min
#   local lease TTL -> 15 min
#   missed renewals -> local Modbus Output OFF, retried every 5 s
#   stale direct RD6018 Modbus/control readback (>20 s) -> latch trip and retry OFF
#   managed/non-autonomous reboot -> boot quarantine and verified-OFF recovery
#
# Autonomous ownership model:
#   explicit transfer only -> persistent autonomous bit
#   no managed heartbeat/lease authority while autonomous
#   reboot while valid autonomous ownership is preserved without communication OFF
#   intrinsic PSU safety remains separately active in rd6018_intrinsic_safety.yaml
#
# Persistent conflict (managed_session && autonomous_mode) always fails closed.
# Unknown/default firmware state is non-autonomous and therefore retains the existing
# managed boot-quarantine behavior.

substitutions:
  rd6018_safety_lease_ttl_ms: "900000"        # 15 minutes
  rd6018_safety_modbus_stale_ms: "20000"      # 20 seconds

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          const bool managed = id(rd6018_safety_managed_session);
          const bool autonomous = id(rd6018_safety_autonomous_mode);

          // Only an explicitly persisted, non-conflicting autonomous state may
          // survive reboot without the managed verified-OFF quarantine.
          if (autonomous && !managed) {
            id(rd6018_safety_boot_quarantine) = false;
            id(rd6018_safety_lease_tripped) = false;
            id(rd6018_safety_last_renew_ms) = 0;
            return;
          }

          id(rd6018_safety_boot_quarantine) = true;
          if (managed || (managed && autonomous)) {
            id(rd6018_safety_lease_tripped) = true;
          }

# Ownership changes are rare, so both ownership bits are persistent. The heartbeat
# timestamp itself remains RAM-only to avoid flash writes on every renewal. A torn
# persistence transition can only produce a non-autonomous or conflicting state; both
# are fail-closed at boot and never silently infer autonomous ownership.
globals:
  - id: rd6018_safety_managed_session
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: rd6018_safety_autonomous_mode
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: rd6018_safety_lease_tripped
    type: bool
    restore_value: no
    initial_value: "false"

  - id: rd6018_safety_boot_quarantine
    type: bool
    restore_value: no
    initial_value: "true"

  - id: rd6018_safety_last_renew_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: rd6018_safety_last_modbus_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: rd6018_safety_last_output_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: rd6018_safety_output_on_readback
    type: bool
    restore_value: no
    initial_value: "true"

  - id: rd6018_safety_generation
    type: uint32_t
    restore_value: no
    initial_value: "0"

# Duplicate internal reads of standard RD60xx registers. Register 10 proves general
# Modbus telemetry is moving. Register 18 separately proves the critical Output state
# was actually read; an uninitialized in-memory switch value is never accepted as OFF.
sensor:
  - platform: modbus_controller
    id: rd6018_safety_modbus_probe
    modbus_controller_id: powersupply
    address: 10
    register_type: holding
    value_type: U_WORD
    internal: true
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    on_value:
      then:
        - lambda: |-
            id(rd6018_safety_last_modbus_rx_ms) = millis();

  - platform: modbus_controller
    id: rd6018_safety_output_probe
    modbus_controller_id: powersupply
    address: 18
    register_type: holding
    value_type: U_WORD
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            id(rd6018_safety_last_output_rx_ms) = millis();
            id(rd6018_safety_output_on_readback) = (((uint16_t) x) & 0x1U) != 0;

  - platform: template
    id: rd6018_safety_lease_generation_sensor
    name: "Safety Lease Generation"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return (float) id(rd6018_safety_generation);

  - platform: template
    id: rd6018_safety_modbus_age_sensor
    name: "Safety Modbus Age"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
      const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
      if (telemetry_rx == 0 || output_rx == 0) return NAN;
      const uint32_t telemetry_age = (uint32_t) (millis() - telemetry_rx);
      const uint32_t output_age = (uint32_t) (millis() - output_rx);
      const uint32_t worst_age = telemetry_age > output_age ? telemetry_age : output_age;
      return worst_age / 1000.0f;

  - platform: template
    id: rd6018_safety_lease_remaining_sensor
    name: "Safety Lease Remaining"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(rd6018_safety_autonomous_mode) ||
          id(rd6018_safety_boot_quarantine) ||
          !id(rd6018_safety_managed_session) ||
          id(rd6018_safety_lease_tripped)) {
        return 0.0f;
      }
      const uint32_t elapsed = (uint32_t) (millis() - id(rd6018_safety_last_renew_ms));
      const uint32_t ttl = ${rd6018_safety_lease_ttl_ms}UL;
      if (elapsed >= ttl) return 0.0f;
      return (ttl - elapsed) / 1000.0f;

binary_sensor:
  - platform: template
    id: rd6018_safety_lease_armed_sensor
    name: "Safety Lease Armed"
    entity_category: diagnostic
    lambda: |-
      return id(rd6018_safety_managed_session) &&
             !id(rd6018_safety_autonomous_mode) &&
             !id(rd6018_safety_lease_tripped) &&
             !id(rd6018_safety_boot_quarantine);

  - platform: template
    id: rd6018_safety_autonomous_mode_sensor
    name: "Safety Autonomous Mode"
    entity_category: diagnostic
    lambda: |-
      return id(rd6018_safety_autonomous_mode);

  - platform: template
    id: rd6018_safety_authority_conflict_sensor
    name: "Safety Authority Conflict"
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      return id(rd6018_safety_managed_session) &&
             id(rd6018_safety_autonomous_mode);

  - platform: template
    id: rd6018_safety_lease_tripped_sensor
    name: "Safety Lease Tripped"
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      return id(rd6018_safety_lease_tripped);

  - platform: template
    id: rd6018_safety_boot_quarantine_sensor
    name: "Safety Boot Quarantine"
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      return id(rd6018_safety_boot_quarantine);

# A private second view of the standard RD60xx Output register. It is used only for
# writes. Safety decisions use rd6018_safety_output_probe + its timestamp above.
switch:
  - platform: modbus_controller
    id: rd6018_safety_output
    modbus_controller_id: powersupply
    address: 18
    register_type: holding
    bitmask: 0x1
    internal: true

button:
  - platform: template
    id: rd6018_safety_lease_renew_button
    name: "Safety Lease Renew"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
            const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
            const bool telemetry_fresh = telemetry_rx != 0 &&
              ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool output_fresh = output_rx != 0 &&
              ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool control_fresh = telemetry_fresh && output_fresh;

            // Managed heartbeats never cross or repair autonomous ownership.
            if (id(rd6018_safety_autonomous_mode)) return;
            if (id(rd6018_safety_boot_quarantine)) return;
            if (id(rd6018_safety_lease_tripped)) return;
            if (!control_fresh) {
              id(rd6018_safety_lease_tripped) = true;
              return;
            }

            // Initial arm additionally requires a fresh, direct Output OFF readback.
            // Ordinary heartbeats occur while Output is legitimately ON.
            if (!id(rd6018_safety_managed_session) && id(rd6018_safety_output_on_readback)) {
              return;
            }

            if (!id(rd6018_safety_managed_session)) {
              id(rd6018_safety_managed_session) = true;
            }
            id(rd6018_safety_last_renew_ms) = now;
            id(rd6018_safety_generation)++;

  - platform: template
    id: rd6018_safety_lease_disarm_button
    name: "Safety Lease Disarm"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
            const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
            const bool telemetry_fresh = telemetry_rx != 0 &&
              ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool output_fresh = output_rx != 0 &&
              ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;

            // Ordinary managed disarm is not an autonomous-mode transition.
            if (id(rd6018_safety_autonomous_mode)) return;
            if (!telemetry_fresh || !output_fresh || id(rd6018_safety_output_on_readback)) return;
            if (id(rd6018_safety_managed_session)) {
              id(rd6018_safety_managed_session) = false;
            }
            id(rd6018_safety_lease_tripped) = false;
            id(rd6018_safety_boot_quarantine) = false;
            id(rd6018_safety_last_renew_ms) = 0;

  - platform: template
    id: rd6018_safety_enter_autonomous_button
    name: "Safety Enter Autonomous"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
            const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
            const bool telemetry_fresh = telemetry_rx != 0 &&
              ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool output_fresh = output_rx != 0 &&
              ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;

            // Inactive entry is deliberately Output-OFF only. Preserving an already
            // energized managed Output uses the distinct release command below.
            if (id(rd6018_safety_managed_session)) return;
            if (id(rd6018_safety_autonomous_mode)) return;
            if (id(rd6018_safety_lease_tripped)) return;
            if (id(rd6018_safety_boot_quarantine)) return;
            if (!telemetry_fresh || !output_fresh) return;
            if (id(rd6018_safety_output_on_readback)) return;

            id(rd6018_safety_autonomous_mode) = true;
            id(rd6018_safety_last_renew_ms) = 0;
            id(rd6018_safety_generation)++;

  - platform: template
    id: rd6018_safety_exit_autonomous_button
    name: "Safety Exit Autonomous"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
            const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
            const bool telemetry_fresh = telemetry_rx != 0 &&
              ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool output_fresh = output_rx != 0 &&
              ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;

            // Return to managed-idle requires direct confirmed OFF. It does not arm
            // a managed lease or revive any old software session.
            if (!id(rd6018_safety_autonomous_mode)) return;
            if (id(rd6018_safety_managed_session)) return;
            if (id(rd6018_safety_lease_tripped)) return;
            if (id(rd6018_safety_boot_quarantine)) return;
            if (!telemetry_fresh || !output_fresh) return;
            if (id(rd6018_safety_output_on_readback)) return;

            id(rd6018_safety_autonomous_mode) = false;
            id(rd6018_safety_last_renew_ms) = 0;
            id(rd6018_safety_generation)++;

  - platform: template
    id: rd6018_safety_lease_release_to_hands_off_button
    name: "Safety Lease Release To Hands Off"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
            const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
            const bool telemetry_fresh = telemetry_rx != 0 &&
              ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool output_fresh = output_rx != 0 &&
              ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool control_fresh = telemetry_fresh && output_fresh;

            if (id(rd6018_safety_autonomous_mode)) return;
            if (id(rd6018_safety_boot_quarantine)) return;
            if (id(rd6018_safety_lease_tripped)) return;
            if (!control_fresh) return;
            if (!id(rd6018_safety_managed_session)) return;

            // Clear managed authority first. A power loss between the two persistent
            // updates falls back to non-autonomous boot quarantine, never to an
            // incorrectly inferred autonomous state.
            id(rd6018_safety_managed_session) = false;
            id(rd6018_safety_autonomous_mode) = true;
            id(rd6018_safety_last_renew_ms) = 0;
            id(rd6018_safety_generation)++;

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
          const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
          const bool telemetry_fresh = telemetry_rx != 0 &&
            ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          const bool output_fresh = output_rx != 0 &&
            ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          const bool control_fresh = telemetry_fresh && output_fresh;
          const bool conflict = id(rd6018_safety_managed_session) &&
            id(rd6018_safety_autonomous_mode);

          if (conflict) {
            id(rd6018_safety_boot_quarantine) = true;
            id(rd6018_safety_lease_tripped) = true;
          } else if (id(rd6018_safety_managed_session)) {
            const uint32_t elapsed = (uint32_t) (now - id(rd6018_safety_last_renew_ms));
            if (!control_fresh || elapsed >= ${rd6018_safety_lease_ttl_ms}UL) {
              id(rd6018_safety_lease_tripped) = true;
            }
          }
      - if:
          condition:
            lambda: |-
              return id(rd6018_safety_boot_quarantine) ||
                     (id(rd6018_safety_managed_session) &&
                      id(rd6018_safety_lease_tripped));
          then:
            - switch.turn_off: rd6018_safety_output
      - lambda: |-
          // Valid autonomous ownership never enters boot quarantine. If autonomous
          // and quarantine coexist, treat it as a conflict/containment state and do
          // not auto-clear it from one OFF readback.
          if (!id(rd6018_safety_boot_quarantine)) return;
          if (id(rd6018_safety_autonomous_mode)) return;
          const uint32_t now = millis();
          const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
          const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
          const bool telemetry_fresh = telemetry_rx != 0 &&
            ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          const bool output_fresh = output_rx != 0 &&
            ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          if (telemetry_fresh && output_fresh && !id(rd6018_safety_output_on_readback)) {
            id(rd6018_safety_boot_quarantine) = false;
          }
