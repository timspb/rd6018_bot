# RD6018 PB Recovery V2 full controller target
#
# Canonical ESPHome Device Builder / CLI target for the existing ESP8266 RD6018
# bridge. This file is intentionally named rd6018.yaml so the repository layout
# can be copied directly into /config/esphome without creating fake package nodes.
#
# Edge contracts:
#   - 15 minute local dead-man lease;
#   - managed -> HANDS_OFF live release;
#   - HANDS_OFF -> managed live adoption;
#   - authoritative raw register-16/17 telemetry.
#
# IMPORTANT: flashing this firmware reboots the ESP. Boot quarantine intentionally
# drives RD6018 Output OFF until a fresh direct register-18 readback proves OFF.
# Do not flash it as a transparent upgrade while an external charge must remain ON.
#
# Real credentials and local addressing belong in esphome/secrets.yaml (gitignored).
# Never commit them.

substitutions:
  model: "RD6018"
  device_name: "rd6018-controller"
  device_friendly_name: "RD 6018"
  device_description: "Power Supply"
  time_timezone: "Europe/Amsterdam"

  RD6018_voltage_maximum: "60"
  RD6018_voltage_accuracy: "2"
  RD6018_voltage_multiplier: "0.01"
  RD6018_current_maximum: "18"
  RD6018_current_accuracy: "2"
  RD6018_current_multiplier: "0.01"
  RD6018_power_accuracy: "2"
  RD6018_power_multiplier: "0.01"

packages:
  safety_lease: !include packages/rd6018_safety_lease.yaml
  telemetry_v2: !include packages/rd6018_telemetry_v2.yaml
  live_adoption: !include packages/rd6018_live_adoption.yaml

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  comment: ${device_description}
  name_add_mac_suffix: false
  project:
    name: "timspb.rd6018-pb-recovery-v2"
    version: "2.0-edge-adoption"

esp8266:
  board: esp01_1m

logger:
  level: INFO
  baud_rate: 0

status_led:
  pin:
    number: GPIO2
    inverted: true

api:
  encryption:
    key: !secret rd6018_api_encryption_key

ota:
  - platform: esphome
    password: !secret rd6018_ota_password

wifi:
  ssid: !secret rd6018_wifi_ssid
  password: !secret rd6018_wifi_password
  manual_ip:
    static_ip: !secret rd6018_static_ip
    gateway: !secret rd6018_gateway
    subnet: !secret rd6018_subnet
  ap:
    ssid: "RD6018 Fallback Hotspot"
    password: !secret rd6018_fallback_ap_password

captive_portal:

uart:
  id: mod_bus
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: none

modbus:
  id: modbus1

modbus_controller:
  - id: powersupply
    address: 0x01
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 5s

time:
  - platform: homeassistant
    id: time_homeassistant
    timezone: ${time_timezone}
    on_time_sync:
      - component.update: sensor_uptime_timestamp

sensor:
  # Stable legacy entity surface used by config.py. Corrected V2 entities are
  # supplied by packages/rd6018_telemetry_v2.yaml and are preferred by the bot.
  - platform: modbus_controller
    id: rd6018_output_voltage_legacy
    name: "Output voltage"
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    modbus_controller_id: powersupply
    address: 10
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    # V2 uses HA last_reported as source freshness. Publish unchanged direct Modbus
    # values too; a stable voltage must not look like a dead telemetry source.
    force_update: true
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    id: rd6018_output_current_legacy
    name: "Output current"
    device_class: current
    state_class: measurement
    unit_of_measurement: "A"
    modbus_controller_id: powersupply
    address: 11
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    force_update: true
    filters:
      - multiply: 0.01

  # Correct the legacy power entity too: P_OUT is register 13, one U_WORD.
  - platform: modbus_controller
    id: rd6018_output_power_legacy
    name: "Output Power"
    device_class: power
    state_class: measurement
    unit_of_measurement: "W"
    modbus_controller_id: powersupply
    address: 13
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    id: rd6018_input_voltage_legacy
    name: "Input voltage"
    device_class: voltage
    unit_of_measurement: "V"
    modbus_controller_id: powersupply
    address: 14
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    id: rd6018_battery_voltage_legacy
    name: "Battery voltage"
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    modbus_controller_id: powersupply
    address: 33
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 2
    force_update: true
    filters:
      - multiply: 0.01

  - platform: modbus_controller
    id: rd6018_battery_charge_legacy
    name: "Battery charge"
    state_class: measurement
    unit_of_measurement: "Ah"
    icon: "mdi:battery-60"
    modbus_controller_id: powersupply
    address: 38
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    id: rd6018_battery_energy_legacy
    name: "Battery energy"
    state_class: measurement
    unit_of_measurement: "Wh"
    icon: "mdi:battery-60"
    modbus_controller_id: powersupply
    address: 40
    register_type: holding
    value_type: U_DWORD
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # Preserve old entity IDs, but derive them from the corrected sign/magnitude
  # V2 channels instead of the old S_DWORD interpretation.
  - platform: template
    id: rd6018_temperature_legacy
    name: "Temperature"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(rd6018_temperature_internal_v2).state;

  - platform: template
    id: rd6018_temperature_external_legacy
    name: "Temperature external"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(rd6018_temperature_external_v2).state;

  - platform: uptime
    id: sensor_uptime
    internal: true

  - platform: template
    id: sensor_uptime_timestamp
    name: "Uptime"
    entity_category: diagnostic
    device_class: timestamp
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (!id(time_homeassistant).now().is_valid()) return NAN;
      return id(time_homeassistant).utcnow().timestamp - id(sensor_uptime).state;

  - platform: wifi_signal
    name: "Wi-Fi Signal"
    disabled_by_default: true
    update_interval: 60s

binary_sensor:
  - platform: modbus_controller
    id: rd6018_keypad_lock_legacy
    name: "Keypad lock"
    entity_category: diagnostic
    device_class: lock
    modbus_controller_id: powersupply
    address: 15
    register_type: holding
    bitmask: 0x1
    filters:
      - invert:

  - platform: modbus_controller
    id: rd6018_battery_mode_legacy
    name: "Battery mode"
    device_class: connectivity
    modbus_controller_id: powersupply
    address: 32
    register_type: holding
    bitmask: 0x1

  - platform: template
    id: rd6018_ovp_triggered_legacy
    name: "Over Voltage Protection"
    device_class: problem
    lambda: |-
      return !isnan(id(rd6018_protection_status_code).state) &&
             ((uint16_t) id(rd6018_protection_status_code).state) == 1U;

  - platform: template
    id: rd6018_ocp_triggered_legacy
    name: "Over Current Protection"
    device_class: problem
    lambda: |-
      return !isnan(id(rd6018_protection_status_code).state) &&
             ((uint16_t) id(rd6018_protection_status_code).state) == 2U;

  - platform: template
    id: rd6018_constant_voltage_legacy
    name: "Constant Voltage"
    lambda: |-
      return !isnan(id(rd6018_regulation_mode_code).state) &&
             ((uint16_t) id(rd6018_regulation_mode_code).state) == 0U;

  - platform: template
    id: rd6018_constant_current_legacy
    name: "Constant Current"
    lambda: |-
      return !isnan(id(rd6018_regulation_mode_code).state) &&
             ((uint16_t) id(rd6018_regulation_mode_code).state) == 1U;

number:
  - platform: modbus_controller
    id: rd6018_output_voltage_setpoint
    name: "Output voltage"
    device_class: voltage
    unit_of_measurement: "V"
    entity_category: config
    modbus_controller_id: powersupply
    address: 8
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 60
    step: 0.01
    lambda: !lambda return x * 0.01;
    write_lambda: !lambda return x * 100.0;

  - platform: modbus_controller
    id: rd6018_output_current_setpoint
    name: "Output current"
    device_class: current
    unit_of_measurement: "A"
    entity_category: config
    modbus_controller_id: powersupply
    address: 9
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 18
    step: 0.01
    lambda: !lambda return x * 0.01;
    write_lambda: !lambda return x * 100.0;

  - platform: modbus_controller
    id: rd6018_ovp_setpoint
    name: "Over Voltage Protection"
    device_class: voltage
    unit_of_measurement: "V"
    entity_category: config
    modbus_controller_id: powersupply
    address: 82
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 60
    step: 0.01
    lambda: !lambda return x * 0.01;
    write_lambda: !lambda return x * 100.0;

  - platform: modbus_controller
    id: rd6018_ocp_setpoint
    name: "Over Current Protection"
    device_class: current
    unit_of_measurement: "A"
    entity_category: config
    modbus_controller_id: powersupply
    address: 83
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 18
    step: 0.01
    lambda: !lambda return x * 0.01;
    write_lambda: !lambda return x * 100.0;

  - platform: modbus_controller
    id: rd6018_backlight
    name: "Backlight"
    icon: "mdi:lightbulb"
    entity_category: config
    modbus_controller_id: powersupply
    address: 72
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 5
    step: 1

switch:
  # Public operator/HA Output entity retained for compatibility. The separate
  # internal safety output in packages/rd6018_safety_lease.yaml is the watchdog actuator.
  - platform: modbus_controller
    id: rd6018_output_public
    name: "Output"
    modbus_controller_id: powersupply
    address: 18
    register_type: holding
    bitmask: 0x1
    entity_category: config

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      disabled_by_default: true
    ssid:
      name: "Wi-Fi SSID"
      disabled_by_default: true
    bssid:
      name: "Wi-Fi BSSID"
      disabled_by_default: true

button:
  - platform: safe_mode
    name: "Safe mode"
