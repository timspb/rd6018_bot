# RD6018 local dead-man safety lease
#
# Include this file as an ESPHome package in the *same node* that owns the
# RD6018 Modbus controller. It assumes that controller has id: powersupply,
# matching the current rdtech ESPHome layout (whose controller poll interval is 5 s).
#
# Safety model:
#   bot/HA -> renew every 10 min
#   local lease TTL -> 30 min
#   missed renewals -> local Modbus Output OFF, retried every 5 s
#   stale direct RD6018 Modbus/control readback (>20 s) -> latch trip and retry OFF
#   every ESPHome reboot -> boot quarantine: repeatedly force Output OFF before
#                           any new lease can be armed
#   reboot during a persisted managed charge -> trip remains latched after OFF
#
# The trip is latched. A late bot cannot simply renew an expired lease and resume
# an old high-voltage session. Disarm is accepted only when direct Modbus is fresh
# and a recent direct read of register 18 confirms RD6018 Output OFF.

substitutions:
  rd6018_safety_lease_ttl_ms: "1800000"       # 30 minutes
  rd6018_safety_modbus_stale_ms: "20000"      # 20 seconds

esphome:
  on_boot:
    # Do not trust an old output state across a controller reboot. Even if the
    # persistent managed-session preference had not yet reached flash, quarantine
    # independently forces RD6018 OFF as soon as direct Modbus becomes usable.
    priority: -100
    then:
      - lambda: |-
          id(rd6018_safety_boot_quarantine) = true;
          if (id(rd6018_safety_managed_session)) {
            id(rd6018_safety_lease_tripped) = true;
          }

# Only the managed-session bit is persistent. The 10-minute heartbeat itself is
# deliberately RAM-only to avoid flash writes on every renewal. Boot quarantine
# makes safety independent from the small persistence-write timing window.
globals:
  - id: rd6018_safety_managed_session
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: rd6018_safety_lease_tripped
    type: bool
    restore_value: no
    initial_value: "false"

  - id: rd6018_safety_boot_quarantine
    type: bool
    restore_value: no
    initial_value: "true"

  - id: rd6018_safety_last_renew_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: rd6018_safety_last_modbus_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: rd6018_safety_last_output_rx_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: rd6018_safety_output_on_readback
    type: bool
    restore_value: no
    initial_value: "true"

  - id: rd6018_safety_generation
    type: uint32_t
    restore_value: no
    initial_value: "0"

# Duplicate internal reads of standard RD60xx registers. Register 10 proves general
# Modbus telemetry is moving. Register 18 separately proves the critical Output state
# was actually read; an uninitialized in-memory switch value is never accepted as OFF.
sensor:
  - platform: modbus_controller
    id: rd6018_safety_modbus_probe
    modbus_controller_id: powersupply
    address: 10
    register_type: holding
    value_type: U_WORD
    internal: true
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    on_value:
      then:
        - lambda: |-
            id(rd6018_safety_last_modbus_rx_ms) = millis();

  - platform: modbus_controller
    id: rd6018_safety_output_probe
    modbus_controller_id: powersupply
    address: 18
    register_type: holding
    value_type: U_WORD
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            id(rd6018_safety_last_output_rx_ms) = millis();
            id(rd6018_safety_output_on_readback) = (((uint16_t) x) & 0x1U) != 0;

  - platform: template
    id: rd6018_safety_lease_generation_sensor
    name: "Safety Lease Generation"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return (float) id(rd6018_safety_generation);

  - platform: template
    id: rd6018_safety_modbus_age_sensor
    name: "Safety Modbus Age"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
      const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
      if (telemetry_rx == 0 || output_rx == 0) return NAN;
      const uint32_t telemetry_age = (uint32_t) (millis() - telemetry_rx);
      const uint32_t output_age = (uint32_t) (millis() - output_rx);
      const uint32_t worst_age = telemetry_age > output_age ? telemetry_age : output_age;
      return worst_age / 1000.0f;

  - platform: template
    id: rd6018_safety_lease_remaining_sensor
    name: "Safety Lease Remaining"
    entity_category: diagnostic
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (id(rd6018_safety_boot_quarantine) ||
          !id(rd6018_safety_managed_session) ||
          id(rd6018_safety_lease_tripped)) {
        return 0.0f;
      }
      const uint32_t elapsed = (uint32_t) (millis() - id(rd6018_safety_last_renew_ms));
      const uint32_t ttl = ${rd6018_safety_lease_ttl_ms}UL;
      if (elapsed >= ttl) return 0.0f;
      return (ttl - elapsed) / 1000.0f;

binary_sensor:
  - platform: template
    id: rd6018_safety_lease_armed_sensor
    name: "Safety Lease Armed"
    entity_category: diagnostic
    lambda: |-
      return id(rd6018_safety_managed_session) &&
             !id(rd6018_safety_lease_tripped) &&
             !id(rd6018_safety_boot_quarantine);

  - platform: template
    id: rd6018_safety_lease_tripped_sensor
    name: "Safety Lease Tripped"
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      return id(rd6018_safety_lease_tripped);

  - platform: template
    id: rd6018_safety_boot_quarantine_sensor
    name: "Safety Boot Quarantine"
    entity_category: diagnostic
    device_class: problem
    lambda: |-
      return id(rd6018_safety_boot_quarantine);

# A private second view of the standard RD60xx Output register. It is used only for
# writes. Safety decisions use rd6018_safety_output_probe + its timestamp above.
switch:
  - platform: modbus_controller
    id: rd6018_safety_output
    modbus_controller_id: powersupply
    address: 18
    register_type: holding
    bitmask: 0x1
    internal: true

button:
  - platform: template
    id: rd6018_safety_lease_renew_button
    name: "Safety Lease Renew"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
            const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
            const bool telemetry_fresh = telemetry_rx != 0 &&
              ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool output_fresh = output_rx != 0 &&
              ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool control_fresh = telemetry_fresh && output_fresh;

            // No lease may be armed until reboot quarantine has proved RD is OFF.
            // Trip is also latched; only a verified-OFF disarm may clear it.
            if (id(rd6018_safety_boot_quarantine)) return;
            if (id(rd6018_safety_lease_tripped)) return;
            if (!control_fresh) {
              id(rd6018_safety_lease_tripped) = true;
              return;
            }

            // Initial arm additionally requires a fresh, direct Output OFF readback.
            // Ordinary heartbeats occur while Output is legitimately ON.
            if (!id(rd6018_safety_managed_session) && id(rd6018_safety_output_on_readback)) {
              return;
            }

            // Avoid rewriting the persistent bool on every heartbeat.
            if (!id(rd6018_safety_managed_session)) {
              id(rd6018_safety_managed_session) = true;
            }
            id(rd6018_safety_last_renew_ms) = now;
            id(rd6018_safety_generation)++;

  - platform: template
    id: rd6018_safety_lease_disarm_button
    name: "Safety Lease Disarm"
    entity_category: diagnostic
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
            const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
            const bool telemetry_fresh = telemetry_rx != 0 &&
              ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
            const bool output_fresh = output_rx != 0 &&
              ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;

            // Never clear a safety trip based only on an HA command. RD6018 must
            // itself have answered recently and register 18 must freshly confirm OFF.
            if (!telemetry_fresh || !output_fresh || id(rd6018_safety_output_on_readback)) return;
            if (id(rd6018_safety_managed_session)) {
              id(rd6018_safety_managed_session) = false;
            }
            id(rd6018_safety_lease_tripped) = false;
            id(rd6018_safety_boot_quarantine) = false;
            id(rd6018_safety_last_renew_ms) = 0;

interval:
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
          const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
          const bool telemetry_fresh = telemetry_rx != 0 &&
            ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          const bool output_fresh = output_rx != 0 &&
            ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          const bool control_fresh = telemetry_fresh && output_fresh;

          if (id(rd6018_safety_managed_session)) {
            const uint32_t elapsed = (uint32_t) (now - id(rd6018_safety_last_renew_ms));
            if (!control_fresh || elapsed >= ${rd6018_safety_lease_ttl_ms}UL) {
              id(rd6018_safety_lease_tripped) = true;
            }
          }
      - if:
          condition:
            lambda: |-
              return id(rd6018_safety_boot_quarantine) ||
                     (id(rd6018_safety_managed_session) &&
                      id(rd6018_safety_lease_tripped));
          then:
            # Repeated OFF is intentional. If the UART was temporarily unavailable,
            # the first successful Modbus opportunity after recovery must still be OFF.
            - switch.turn_off: rd6018_safety_output
      - lambda: |-
          // Boot quarantine clears automatically only after a fresh direct read of
          // Output register 18 confirms OFF. Do not trust the switch object's default
          // in-memory state before that register has actually been observed.
          if (!id(rd6018_safety_boot_quarantine)) return;
          const uint32_t now = millis();
          const uint32_t telemetry_rx = id(rd6018_safety_last_modbus_rx_ms);
          const uint32_t output_rx = id(rd6018_safety_last_output_rx_ms);
          const bool telemetry_fresh = telemetry_rx != 0 &&
            ((uint32_t) (now - telemetry_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          const bool output_fresh = output_rx != 0 &&
            ((uint32_t) (now - output_rx)) <= ${rd6018_safety_modbus_stale_ms}UL;
          if (telemetry_fresh && output_fresh && !id(rd6018_safety_output_on_readback)) {
            id(rd6018_safety_boot_quarantine) = false;
          }
